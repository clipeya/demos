<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%229%22 r=%226%22 fill=%22%23c8102e%22/%3E%3C/svg%3E">
<title>Panel del tatuador · Adikto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
.panel{padding:24px 0 80px}
.panel h1{font-size:clamp(40px,10vw,72px)}
.quien{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px}
.quien button{background:var(--fondo2);color:var(--tx);border:1px solid var(--linea);border-radius:999px;min-height:44px;padding:0 18px;font:600 15px var(--texto);cursor:pointer}
.quien button[aria-pressed=true]{background:var(--rojo);border-color:var(--rojo)}
.bloque{background:var(--fondo2);border:1px solid var(--linea);border-radius:var(--rad);padding:16px;margin-bottom:18px}
.bloque h2{font-size:28px}
.sem{display:grid;gap:12px}
.sem-dia b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx2);margin-bottom:6px}
.sem-dia .huecos{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sem-dia .hueco{min-height:44px;font-size:12.5px}
.sol{display:grid;gap:10px}
.sol-it{border:1px solid var(--linea);border-radius:12px;padding:14px;display:grid;gap:8px;background:#0e0e0e}
.sol-it .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.sol-it p{margin:0;font-size:14px;color:var(--tx2)}
.sol-it p b{color:var(--tx)}
.sol-it img{max-height:120px;border-radius:8px}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.acc .btn{min-height:42px;font-size:14px}
.acc select{font:14px var(--texto);background:#0d0d0d;color:var(--tx);border:1px solid #333;border-radius:10px;min-height:42px;padding:0 10px;max-width:100%}
.mini{font-size:12px;color:var(--tx2)}
@media (min-width:900px){.dos-col{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}}
</style>
</head>
<body>
<div class="franja">Demo privada · panel del tatuador · sin servidor (se guarda en este navegador)</div>
<header class="cab">
  <a class="logo" href="index.html">ADIKTO<span>PANEL</span></a>
  <nav class="cab-nav"><a href="index.html#agenda" class="btn btn-borde">Ver la agenda pública</a></nav>
</header>
<main class="panel caja">
  <p class="eti">Panel del tatuador</p>
  <h1>Tu semana.</h1>
  <div class="quien" id="quien" role="group" aria-label="Tatuador"></div>
  <div class="dos-col">
    <section class="bloque" aria-labelledby="solTit">
      <h2 id="solTit">Solicitudes <span id="nPend" class="pild solicitado"></span></h2>
      <div class="sol" id="sol"></div>
    </section>
    <section class="bloque" aria-labelledby="semTit">
      <h2 id="semTit">Huecos</h2>
      <p class="mini">Toca un hueco para pasarlo de libre a ocupado (o al revés). Lo ve la agenda al momento.</p>
      <div class="sem" id="sem"></div>
      <div class="leyenda"><span class="pild libre">Libre</span><span class="pild solicitado">Solicitado</span><span class="pild ocupado">Ocupado</span></div>
    </section>
  </div>
  <p class="mini"><button type="button" class="btn btn-borde" id="reiniciar">Reiniciar demo</button></p>
</main>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>
<script src="app.js"></script>
<script>
(function(){
  const A=window.Adikto, $=s=>document.querySelector(s);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sem=A.semana();
  let yo=(new URLSearchParams(location.search).get('t'))||A.TATUADORES[0].id;
  let tAv; function aviso(t,mal){const a=$('#aviso');a.textContent=t;a.classList.toggle('mal',!!mal);a.classList.add('ver');clearTimeout(tAv);tAv=setTimeout(()=>a.classList.remove('ver'),3000);}

  function pintar(){
    const s=A.leer();
    $('#quien').innerHTML=A.TATUADORES.map(t=>'<button type="button" data-yo="'+t.id+'" aria-pressed="'+(t.id===yo)+'">'+esc(t.nombre)+'</button>').join('');
    // huecos de la semana
    $('#sem').innerHTML=sem.map(d=>'<div class="sem-dia"><b>'+d.txt+' '+d.num+'</b><div class="huecos">'+A.FRANJAS.map(f=>{const k=A.clave(yo,d.iso,f.ini),e=A.estado(k,s);return '<button type="button" class="hueco '+e+'" data-clave="'+k+'">'+f.ini+'</button>';}).join('')+'</div></div>').join('');
    // solicitudes
    const mias=s.solicitudes.filter(r=>r.tatuador===yo&&r.estado!=='rechazada').slice().reverse();
    const pend=mias.filter(r=>r.estado==='pendiente').length;
    $('#nPend').textContent=pend?pend+' nueva'+(pend>1?'s':''):''; $('#nPend').hidden=!pend;
    const libres=[];sem.forEach(d=>A.FRANJAS.forEach(f=>{const k=A.clave(yo,d.iso,f.ini);if(A.estado(k,s)==='libre')libres.push(k);}));
    const txt={pendiente:'Pendiente',aceptada:'Aceptada',propuesta:'Propuesta enviada'};
    $('#sol').innerHTML=mias.length?mias.map(r=>'<div class="sol-it" data-id="'+r.id+'"><div class="top"><b>'+esc(r.nombre)+'</b><span class="est '+r.estado+'">'+txt[r.estado]+'</span></div>'+
      '<p><b>Hueco:</b> '+esc(A.txtHueco(r.estado==='propuesta'?r.propuesta:r.clave))+'</p><p><b>Idea:</b> '+esc(r.idea)+'</p><p><b>Zona:</b> '+esc(r.zona)+' · <b>Tamaño:</b> '+esc(r.tamano)+(r.contacto?' · <b>Contacto:</b> '+esc(r.contacto):'')+'</p>'+
      (r.foto?'<img src="'+r.foto+'" alt="Referencia de '+esc(r.nombre)+'">':(r.fotoNombre?'<p class="mini">Foto: '+esc(r.fotoNombre)+'</p>':''))+
      (r.estado==='pendiente'?'<div class="acc"><button type="button" class="btn btn-tinta" data-aceptar="'+r.id+'">Aceptar</button><select data-sel="'+r.id+'" aria-label="Otra hora">'+(libres.length?libres.map(k=>'<option value="'+k+'">'+esc(A.txtHueco(k).split(' · ').slice(1).join(' · '))+'</option>').join(''):'<option value="">Sin huecos libres</option>')+'</select><button type="button" class="btn btn-borde" data-proponer="'+r.id+'">Proponer otra hora</button><button type="button" class="btn btn-borde" data-rechazar="'+r.id+'">No puedo</button></div>':'')+
      '</div>').join(''):'<p class="mini">No hay solicitudes todavía. Pide una cita desde la agenda pública y aparecerá aquí.</p>';
  }
  document.addEventListener('click',ev=>{
    const q=ev.target.closest('[data-yo]'); if(q){yo=q.dataset.yo;history.replaceState(null,'','?t='+yo);pintar();return;}
    const h=ev.target.closest('.hueco');
    if(h){const e=A.estado(h.dataset.clave);
      if(e==='solicitado'){aviso('Ese hueco tiene una solicitud: acéptala o propone otra hora.',true);return;}
      if(e==='pasado'){aviso('Esa hora ya ha pasado.',true);return;}
      const r=A.marcar(h.dataset.clave,e==='libre'?'ocupado':'libre'); if(!r.ok)aviso(r.motivo,true); return;}
    const ac=ev.target.closest('[data-aceptar]'); if(ac){const r=A.aceptar(ac.dataset.aceptar);aviso(r.ok?'Cita aceptada. El hueco queda ocupado.':r.motivo,!r.ok);return;}
    const pr=ev.target.closest('[data-proponer]'); if(pr){const sel=document.querySelector('[data-sel="'+pr.dataset.proponer+'"]');if(!sel||!sel.value){aviso('No hay otra hora libre.',true);return;}const r=A.proponer(pr.dataset.proponer,sel.value);aviso(r.ok?'Propuesta enviada.':r.motivo,!r.ok);return;}
    const re=ev.target.closest('[data-rechazar]'); if(re){A.rechazar(re.dataset.rechazar);aviso('Solicitud cerrada.');return;}
  });
  $('#reiniciar').onclick=()=>{A.reiniciar();aviso('Demo reiniciada.');};
  addEventListener('adikto:cambio',pintar);
  pintar();
})();
</script>
</body>
</html>
